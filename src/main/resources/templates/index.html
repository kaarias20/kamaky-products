<!DOCTYPE html>
<!-- Página de inicio (base). Persona 2 la completa con los productos destacados y las categorías -->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{plantilla/fragmentos :: head}"></head>
    <body class="bg-light">
        <header th:replace="~{plantilla/fragmentos :: encabezado}"></header>
        <section th:replace="~{plantilla/fragmentos :: mensajes}"></section>

        <section class="bg-danger-subtle py-5">
            <div class="container text-center">
                <h1 class="fw-bold text-danger-emphasis">[[#{inicio.titulo}]]</h1>
                <p class="lead text-danger-emphasis">[[#{inicio.subtitulo}]]</p>
                <div class="d-flex justify-content-center gap-3 mt-3">
                    <a class="btn btn-danger btn-lg rounded-pill px-4" th:href="@{/producto/catalogo}">[[#{inicio.verCatalogo}]]</a>
                    <a class="btn btn-outline-danger btn-lg rounded-pill px-4" th:href="@{/solicitud/nueva}">[[#{inicio.personalizar}]]</a>
                </div>
            </div>
        </section>

        <section class="container py-5">
            <!-- Aquí van las categorías y los productos destacados (HU-001, HU-003) -->
        </section>

        <footer th:replace="~{plantilla/fragmentos :: pie}"></footer>
    </body>
</html>
